<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dream Estate</title>
<style>
  :root { --ink: #fbf5ea; --panel: rgba(28, 20, 16, 0.62); --line: rgba(251, 245, 234, 0.18); --accent: #e0503f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1210; color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #scene:active { cursor: grabbing; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .label { position: absolute; left: 0; top: 0; white-space: nowrap; padding: 3px 9px; border-radius: 999px;
    font-size: 12px; letter-spacing: 0.02em; background: rgba(28, 20, 16, 0.6); border: 1px solid var(--line);
    backdrop-filter: blur(4px); will-change: transform; }
  .label.zone { font-size: 13px; font-weight: 600; padding: 4px 11px; }
  .label.detail { font-size: 11px; opacity: 0.92; }
  .label.room { font-size: 11px; background: rgba(251, 245, 234, 0.9); color: #2a1d17; border-color: transparent; }
  .label.level { font-size: 12px; font-weight: 600; background: var(--accent); border-color: transparent; }
  .hud { position: fixed; z-index: 2; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(10px); }
  #title { top: 16px; left: 16px; padding: 12px 16px 11px; }
  #title h1 { margin: 0; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-weight: 500;
    font-size: 24px; letter-spacing: 0.01em; line-height: 1.1; }
  #title p { margin: 5px 0 0; font-size: 12px; opacity: 0.78; }
  #title .phase { display: inline-block; margin-right: 6px; padding: 1px 7px; border-radius: 999px; background: var(--accent);
    font-weight: 600; font-size: 11px; opacity: 1; }
  #tools { top: 16px; right: 16px; padding: 8px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; max-width: 64vw; }
  #tools .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  #tools .cap { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; padding-left: 4px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  button { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 0; padding: 7px 12px; cursor: pointer;
    transition: background 0.15s; }
  button:hover { background: rgba(251, 245, 234, 0.12); }
  button.on { background: rgba(251, 245, 234, 0.92); color: #2a1d17; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .chip { border: 1px solid var(--line); border-radius: 10px; }
  #views { bottom: 18px; left: 50%; transform: translateX(-50%); padding: 6px; display: flex; gap: 4px; max-width: calc(100vw - 32px); overflow-x: auto; }
  #views button { border-radius: 9px; white-space: nowrap; }
  #help { bottom: 78px; left: 50%; transform: translateX(-50%); font-size: 12px; opacity: 0.85; text-shadow: 0 1px 3px rgba(0,0,0,0.6); white-space: nowrap; }
  @media (max-width: 900px) { #help { display: none; } #tools { max-width: calc(100vw - 32px); left: 16px; right: auto; top: 92px; align-items: flex-start; } #tools .row { justify-content: flex-start; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>

<div id="title" class="hud panel">
  <h1>Dream Estate</h1>
  <p><span class="phase">Phase 2</span>Exterior options · <span id="stats"></span></p>
</div>

<div id="tools" class="hud panel">
  <div class="row">
    <span class="cap">Exterior</span>
    <div class="seg" id="exteriors" role="group" aria-label="Exterior design"></div>
  </div>
  <div class="row">
    <div class="seg" role="group" aria-label="Time of day">
      <button data-time="day">Day</button>
      <button data-time="sunset">Sunset</button>
      <button data-time="night">Night</button>
    </div>
    <button id="explode" class="chip" title="Lift the floors apart to see every room, including the basement levels">Open up the floors</button>
    <button id="toggleLabels" class="chip on">Labels</button>
  </div>
</div>

<div id="help" class="hud">Drag to orbit · Scroll to zoom · Right-drag to pan · Double-click anywhere to fly there</div>
<div id="views" class="hud panel" role="group" aria-label="Viewpoints"></div>

<script>/*__BUNDLE__*/</script>
</body>
</html>
